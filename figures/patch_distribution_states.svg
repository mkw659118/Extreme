<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#263238"/>
    </marker>
    <linearGradient id="headerGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#546E7A"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#FAFAFA"/>

  <text x="600" y="54" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="url(#headerGrad)">
    Patch-wise Distribution States in a Time Series Window
  </text>
  <text x="600" y="86" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#546E7A">
    A single input window can contain several local regimes; each patch may have its own distribution posterior.
  </text>

  <g transform="translate(70,130)">
    <text x="0" y="-18" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#263238">
      Input window x: [L, C]
    </text>

    <rect x="0" y="0" width="720" height="210" rx="8" fill="#FFFFFF" stroke="#CFD8DC" filter="url(#softShadow)"/>

    <g id="patches">
      <rect x="20" y="24" width="108" height="152" rx="6" fill="#E3F2FD" stroke="#64B5F6"/>
      <rect x="132" y="24" width="108" height="152" rx="6" fill="#E8F5E9" stroke="#81C784"/>
      <rect x="244" y="24" width="108" height="152" rx="6" fill="#FFF8E1" stroke="#FFD54F"/>
      <rect x="356" y="24" width="108" height="152" rx="6" fill="#FCE4EC" stroke="#F06292"/>
      <rect x="468" y="24" width="108" height="152" rx="6" fill="#EDE7F6" stroke="#9575CD"/>
      <rect x="580" y="24" width="108" height="152" rx="6" fill="#E0F2F1" stroke="#4DB6AC"/>

      <text x="74" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#37474F">Patch 1</text>
      <text x="186" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#37474F">Patch 2</text>
      <text x="298" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#37474F">Patch 3</text>
      <text x="410" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#37474F">Patch 4</text>
      <text x="522" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#37474F">Patch 5</text>
      <text x="634" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#37474F">Patch 6</text>
    </g>

    <polyline points="
      26,132 38,128 50,134 62,126 74,130 86,127 98,133 110,129 122,131
      138,120 150,114 162,109 174,101 186,96 198,88 210,84 222,76 234,70
      250,121 262,113 274,133 286,105 298,144 310,96 322,138 334,111 346,126
      362,134 374,126 386,114 398,90 410,52 422,96 434,121 446,132 458,136
      474,96 486,105 498,88 510,100 522,82 534,98 546,86 558,102 570,91
      586,112 598,117 610,121 622,126 634,130 646,133 658,137 670,140 682,143"
      fill="none" stroke="#263238" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <text x="74" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1565C0">low variance</text>
    <text x="186" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2E7D32">up trend</text>
    <text x="298" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F57F17">volatile</text>
    <text x="410" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#AD1457">spike</text>
    <text x="522" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#512DA8">periodic</text>
    <text x="634" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#00796B">recovery</text>
  </g>

  <g transform="translate(870,130)">
    <rect x="0" y="0" width="260" height="210" rx="8" fill="#FFFFFF" stroke="#CFD8DC" filter="url(#softShadow)"/>
    <text x="130" y="33" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#263238">
      Patch statistics
    </text>
    <text x="28" y="74" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#37474F">z[p] = f(patch[p])</text>
    <text x="28" y="106" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#37474F">mean, std, max |dx|</text>
    <text x="28" y="138" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#37474F">last value, slope</text>
    <text x="28" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#607D8B">Shape: [B, P, C, D]</text>
  </g>

  <path d="M794,235 C820,235 835,235 858,235" fill="none" stroke="#263238" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(70,410)">
    <rect x="0" y="0" width="330" height="210" rx="8" fill="#FFFFFF" stroke="#CFD8DC" filter="url(#softShadow)"/>
    <text x="165" y="33" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#263238">
      Patch-wise Student-t mixture
    </text>
    <text x="28" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#37474F">q[p, c, k] = P(state k | z[p, c])</text>

    <g transform="translate(30,92)">
      <path d="M0,78 C20,78 24,52 40,52 C57,52 60,78 80,78" fill="none" stroke="#1976D2" stroke-width="3"/>
      <path d="M84,78 C106,78 110,20 128,20 C148,20 152,78 174,78" fill="none" stroke="#D81B60" stroke-width="3"/>
      <path d="M180,78 C208,78 214,42 240,42 C266,42 272,78 300,78" fill="none" stroke="#00897B" stroke-width="3"/>
      <line x1="0" y1="82" x2="300" y2="82" stroke="#90A4AE" stroke-width="1"/>
      <text x="40" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1976D2">state 1</text>
      <text x="130" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#D81B60">state 2</text>
      <text x="240" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#00897B">state 3</text>
    </g>
    <text x="28" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#607D8B">
      Each patch can choose a different local distribution.
    </text>
  </g>

  <g transform="translate(455,410)">
    <rect x="0" y="0" width="290" height="210" rx="8" fill="#FFFFFF" stroke="#CFD8DC" filter="url(#softShadow)"/>
    <text x="145" y="33" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#263238">
      Posterior map
    </text>
    <text x="28" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#607D8B">
      Rows: patches, columns: states
    </text>

    <g transform="translate(34,82)">
      <rect x="0" y="0" width="54" height="26" fill="#1976D2" opacity="0.85"/>
      <rect x="56" y="0" width="54" height="26" fill="#1976D2" opacity="0.25"/>
      <rect x="112" y="0" width="54" height="26" fill="#1976D2" opacity="0.15"/>
      <rect x="168" y="0" width="54" height="26" fill="#1976D2" opacity="0.08"/>

      <rect x="0" y="28" width="54" height="26" fill="#43A047" opacity="0.20"/>
      <rect x="56" y="28" width="54" height="26" fill="#43A047" opacity="0.78"/>
      <rect x="112" y="28" width="54" height="26" fill="#43A047" opacity="0.18"/>
      <rect x="168" y="28" width="54" height="26" fill="#43A047" opacity="0.10"/>

      <rect x="0" y="56" width="54" height="26" fill="#F9A825" opacity="0.15"/>
      <rect x="56" y="56" width="54" height="26" fill="#F9A825" opacity="0.20"/>
      <rect x="112" y="56" width="54" height="26" fill="#F9A825" opacity="0.82"/>
      <rect x="168" y="56" width="54" height="26" fill="#F9A825" opacity="0.22"/>

      <rect x="0" y="84" width="54" height="26" fill="#D81B60" opacity="0.10"/>
      <rect x="56" y="84" width="54" height="26" fill="#D81B60" opacity="0.12"/>
      <rect x="112" y="84" width="54" height="26" fill="#D81B60" opacity="0.20"/>
      <rect x="168" y="84" width="54" height="26" fill="#D81B60" opacity="0.88"/>

      <text x="-16" y="18" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#546E7A">p1</text>
      <text x="-16" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#546E7A">p2</text>
      <text x="-16" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#546E7A">p3</text>
      <text x="-16" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#546E7A">p4</text>

      <text x="27" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#546E7A">k1</text>
      <text x="83" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#546E7A">k2</text>
      <text x="139" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#546E7A">k3</text>
      <text x="195" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#546E7A">k4</text>
    </g>
  </g>

  <g transform="translate(820,410)">
    <rect x="0" y="0" width="310" height="210" rx="8" fill="#FFFFFF" stroke="#CFD8DC" filter="url(#softShadow)"/>
    <text x="155" y="33" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#263238">
      Router context for forecasting
    </text>
    <text x="28" y="72" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#37474F">q_window = aggregate(q[p, c, k])</text>
    <text x="28" y="106" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#37474F">q_patch  = mean over channels</text>
    <text x="28" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#37474F">MoE weights = router(q, embedding)</text>
    <rect x="65" y="162" width="180" height="30" rx="15" fill="#263238"/>
    <text x="155" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
      Forecast [H, C]
    </text>
  </g>

  <path d="M402,515 C425,515 435,515 450,515" fill="none" stroke="#263238" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M747,515 C775,515 790,515 814,515" fill="none" stroke="#263238" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(90,665)">
    <circle cx="0" cy="-5" r="5" fill="#1976D2"/>
    <text x="14" y="0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#546E7A">One window, multiple patch states</text>
    <circle cx="250" cy="-5" r="5" fill="#D81B60"/>
    <text x="264" y="0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#546E7A">Channel-wise fitting is optional</text>
    <circle cx="520" cy="-5" r="5" fill="#00897B"/>
    <text x="534" y="0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#546E7A">Retrieval can still use the whole multivariate window</text>
  </g>
</svg>
